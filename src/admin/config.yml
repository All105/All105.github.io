    - name: pageKey
      label: pageKey
      widget: hidden
    - name: body
      label: Text / Texto
      widget: markdown
      hint: "Text in {{ … }} or {% … %} is filled in automatically — do not remove it. / El texto entre {{ … }} o {% … %} se rellena solo — no lo borres."
  - name: accessibility_en
    label: Accessibility (EN)
    file: src/legal/accessibility-en.md
    fields:
    - name: title
