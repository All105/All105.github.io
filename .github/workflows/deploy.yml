name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      NOINDEX: ${{ vars.NOINDEX }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks CLI image: free for personal and organization repos (the gitleaks Action needs a license for orgs).
      - name: Secret scan (gitleaks, full history)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --verbose

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build + site tests + secret patterns + Worker tests
        run: npm test

      - name: Browser tests (keyboard, touch, reduced motion, language, form, mobile, CSP)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
